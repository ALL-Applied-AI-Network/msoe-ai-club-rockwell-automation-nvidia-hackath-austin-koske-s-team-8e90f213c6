<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
<title id="title">Direct temporal liquid inspection architecture</title>
<desc id="desc">Original RGB supplies YOLO geometry and a paired difference U-Net. Original RGB, vial geometry and model masks enter unchanged measurement QA, then independently qualified recipe evidence goes to an operator.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0 L10 3.5 L0 7Z" fill="#64748b"/></marker></defs>
<rect width="1120" height="790" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#0f172a">
<text x="40" y="45" font-size="26" font-weight="700">Direct temporal liquid inspection</text>
<text x="40" y="74" font-size="15">October 26, 2026 · synthetic-trained development candidate · operator in the loop</text>
<rect x="40" y="110" width="315" height="100" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="56" y="138" font-size="17" font-weight="700">Original source RGB</text>
<text x="56" y="163" font-size="14">640 × 480; source hash + frame / PTS</text>
<text x="56" y="184" font-size="14">Preserve raw pixels for measurement</text>
<rect x="405" y="110" width="315" height="100" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="421" y="138" font-size="17" font-weight="700">Earlier reference RGB</text>
<text x="421" y="163" font-size="14">Same camera, aligned geometry</text>
<text x="421" y="184" font-size="14">Separate identity and qualification</text>
<rect x="770" y="110" width="310" height="100" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="786" y="138" font-size="17" font-weight="700">YOLO11n</text>
<text x="786" y="163" font-size="14">Synthetic CSI fitting; COCO init</text>
<text x="786" y="184" font-size="14">Class 0 vial geometry only</text>
<rect x="40" y="265" width="360" height="105" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="56" y="293" font-size="17" font-weight="700">Paired preprocessing</text>
<text x="56" y="318" font-size="14">Fixed 112 × 192 liquid ROI</text>
<text x="56" y="339" font-size="14">Anchor gain → signed + absolute RGB</text>
<text x="56" y="360" font-size="14">6 channels; no future frames</text>
<rect x="40" y="420" width="360" height="105" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="56" y="448" font-size="17" font-weight="700">Small GroupNorm U-Net</text>
<text x="56" y="473" font-size="14">16 / 32 / 64 / 128 channels</text>
<text x="56" y="494" font-size="14">Mask + presence; frozen 0.5 thresholds</text>
<text x="56" y="515" font-size="14">Random initialization; selected epoch 40</text>
<rect x="445" y="420" width="290" height="105" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="461" y="448" font-size="17" font-weight="700">Liquid proposal</text>
<text x="461" y="473" font-size="14">Largest mask component</text>
<text x="461" y="494" font-size="14">Full-source coordinates</text>
<text x="461" y="515" font-size="14">Keep raw mask and presence</text>
<rect x="770" y="365" width="310" height="160" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="786" y="393" font-size="17" font-weight="700">Unchanged measurement QA</text>
<text x="786" y="418" font-size="14">Active-vial association and tracking</text>
<text x="786" y="439" font-size="14">Containment, stability and sampling</text>
<text x="786" y="460" font-size="14">Measure color from original RGB</text>
<text x="786" y="481" font-size="14">Failed checks → unavailable</text>
<rect x="40" y="590" width="450" height="105" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="56" y="618" font-size="17" font-weight="700">Independent qualification</text>
<text x="56" y="643" font-size="14">Reference / alignment / reset status</text>
<text x="56" y="664" font-size="14">Intended recipe, accepted endpoint, completion</text>
<text x="56" y="685" font-size="14">Physical vial identity; keep unknowns explicit</text>
<rect x="580" y="590" width="500" height="105" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="596" y="618" font-size="17" font-weight="700">Operator interface and response</text>
<text x="596" y="643" font-size="14">Source-aligned mask, QA reasons, source age</text>
<text x="596" y="664" font-size="14">Qualified comparison or explicit unavailable state</text>
<text x="596" y="685" font-size="14">Acknowledgement / response; no direct PLC control</text>
<path d="M198 210 V265" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M562 210 V240 H310 V265" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M925 210 V365" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M355 160 H380 V330 H850 V365" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M220 370 V420" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M400 472 H445" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M735 472 H770" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M925 525 V590" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M490 642 H580" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="40" y="738" font-size="15" font-weight="700">SAM2.1 and Faster R-CNN are optional comparison paths, not required liquid stages.</text>
<text x="40" y="763" font-size="14">QA availability is not accuracy. Reference review, real mask/onset evaluation and the live app rehearsal remain pending.</text>
<path d="M198 110 V95 H925 V110" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
</g></svg>
