[project]
name = "team-app-api"
version = "0.1.0"
description = "Database-free FastAPI starter for the operator app team"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.14,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.10.1,<3",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
