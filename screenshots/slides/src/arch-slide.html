<title>Linewatch Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --ink: #262626; --muted: #5e5e5e; --line: #3d3d3d; --card: #ffffff;
    --border: #cfcfcf; --group: #f7f7f7; --nv: #76b900; --nv-soft: #f3f9e6;
    --learned: #55761c; --learned-soft: #eef4e3; --rule: #3d3d3d; --rule-soft: #ececec;
    --ai: #1f6f8f; --ai-soft: #e6f1f5; --alert: #d93a2b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Century Gothic", "URW Gothic", sans-serif; }
  #root { display: flex; justify-content: center; padding: 16px; overflow-x: auto; }
  .canvas { position: relative; width: 1600px; height: 960px; flex: none; background: var(--bg); }
  .group, .card { position: absolute; border-radius: 12px; }
  .group { border: 1.5px solid var(--border); background: var(--group); }
  .group.nv { border: 2px solid var(--nv); background: var(--nv-soft); }
  .group-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px 0; }
  .group-title { font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
  .group-sub { font-size: 12.5px; color: var(--muted); padding: 2px 16px 0; }
  .nvmark { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 15px; letter-spacing: 0.04em; color: #111; }
  .card { display: flex; flex-direction: column; justify-content: center; background: var(--card); border: 1.5px solid var(--border); padding: 10px 12px; box-shadow: 0 1px 2px rgba(20,24,31,.06); }
  .card h4 { margin: 0; font-size: 14.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .card p { margin: 4px 0 0; font-size: 12px; line-height: 1.35; color: var(--muted); }
  .card ul { margin: 6px 0 0; padding-left: 16px; font-size: 12px; line-height: 1.45; color: var(--ink); }
  .card.learned { border-color: var(--learned); }
  .card.rule { border-color: var(--rule); }
  .card.ai { border-color: var(--ai); }
  .badge { position: absolute; top: -9px; right: 10px; font: 700 9.5px/1 "JetBrains Mono", monospace; letter-spacing: .06em;
           padding: 4px 6px; border-radius: 5px; color: #fff; }
  .badge.learned { background: var(--learned); } .badge.rule { background: var(--rule); } .badge.ai { background: var(--ai); }
  .badge.nv { background: var(--nv); color: #111; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .label { position: absolute; font-size: 11.5px; color: var(--muted); background: #ffffff; padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
  .label.on-group { background: var(--group); } .label.on-nv { background: var(--nv-soft); }
  .alerts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; justify-content: center; }
  .alerts span { font: 700 10px/1 "JetBrains Mono", monospace; padding: 4px 6px; border-radius: 4px; border: 1px solid; }
  .legend { display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; color: var(--muted); }
  .legend div { display: flex; align-items: center; gap: 8px; }
  .swatch { width: 14px; height: 14px; border-radius: 4px; border: 2px solid; }
  svg.edges { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
</style>
</head>

    <div className={`group${nv ? " nv" : ""}`} style={{ left: x, top: y, width: w, height: h }}>
      <div className="group-head">{title}{right && <span style={{ marginLeft: "auto" }}>{right}</span>}</div>
      {sub && <div className="group-sub">{sub}</div>}
      {children}
    </div>
  );
}

function Card({ x, y, w, h, kind, badge, icon, title, children, center }) {
  return (
    <div className={`card ${kind || ""}${center ? " center" : ""}`} style={{ left: x, top: y, width: w, height: h }}>
      {badge && <span className={`badge ${badge[0]}`}>{badge[1]}</span>}
      {(icon || title) && <h4>{icon}{title}</h4>}
      {children}
    </div>
  );
}

// Orthogonal edge through the given points, arrowhead at the end (and the start when both).
function Edge({ pts, dashed, both, color = "var(--line)" }) {
  const d = pts.map(([x, y], i) => `${i ? "L" : "M"}${x},${y}`).join(" ");
  const id = color.replace(/[^a-z]/gi, "");
  return (
    <g>
      <path d={d} fill="none" stroke={color} strokeWidth={2} strokeDasharray={dashed ? "7 6" : undefined}
            markerEnd={`url(#arrow-${id})`} markerStart={both ? `url(#arrow-${id})` : undefined} />
    </g>
  );
}

function Label({ x, y, on, children }) {
  return <div className={`label${on ? " on-" + on : ""}`} style={{ left: x, top: y }}>{children}</div>;
}

function Pill({ children }) {
  return <span style={{ font: "700 11.5px/1 'Century Gothic'", padding: "5px 8px", borderRadius: 6, background: "var(--rule-soft)", color: "var(--rule)" }}>{children}</span>;
}

}
